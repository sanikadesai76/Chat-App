
config:
  target: "http://localhost:3000"
  
  phases:
    - duration: 60
      arrivalRate: 10
      name: "500-user ramp test"

  engines:
    socketio: {}
  socketio:
    transports:
      - websocket

scenarios:
  - name: "Join room and exchange messages"
    engine: socketio
    flow:
      - emit:
          channel: "joinRoom"
          data:
            roomId: "load-test-room"
      - think: 1
      - emit:
          channel: "sendMessage"
          data:
            roomId: "load-test-room"
            text: "Moderate load test message"
      - think: 1
